name: port-check
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream tag to try (e.g. v0.21.1). Empty = latest upstream release.'
        required: false
        type: string
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: port-check
  cancel-in-progress: true
jobs:
  port:
    runs-on: macos-14
    timeout-minutes: 240
    env:
      APP: filmcraft
      UPSTREAM_REPO: storytold/filmcraft
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: madson
          fetch-depth: 0
      - name: Configure git
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git config user.name  "madson-port-bot"
          git config user.email "madson-port-bot@users.noreply.github.com"
          git config rerere.enabled true
          git config merge.conflictStyle zdiff3
          git config diff.algorithm histogram
      # rerere: a conflict resolved once is reused by the next port.
      - name: Restore rerere cache
        uses: actions/cache@v4
        with:
          path: .git/rr-cache
          key: rerere-filmcraft
          restore-keys: rerere-
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.upstream_tag }}"
          if [ -z "$TAG" ]; then TAG=$(gh release view --repo "${UPSTREAM_REPO}" --json tagName -q .tagName); fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Fetch upstream
        run: git fetch upstream --tags
      - name: Already up to date?
        id: state
        run: |
          if git merge-base --is-ancestor "${{ steps.tag.outputs.tag }}" HEAD; then
            echo "uptodate=yes" >> "$GITHUB_OUTPUT"
          else
            echo "uptodate=no" >> "$GITHUB_OUTPUT"
          fi
      # Dry merge on a scratch branch: madson is never touched until the gates are green.
      - name: Dry merge
        id: merge
        if: steps.state.outputs.uptodate == 'no'
        run: |
          TAG='${{ steps.tag.outputs.tag }}'
          git switch -c "port-bot/${TAG}"
          if git merge --no-commit --no-ff "$TAG"; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > conflicts.txt
            git status --short >> conflicts.txt
          fi
      - name: Upload conflict list
        if: steps.merge.outputs.result == 'conflict'
        uses: actions/upload-artifact@v4
        with:
          name: conflicts
          path: conflicts.txt
      - name: Rust toolchain
        if: steps.merge.outputs.result == 'merged'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Gates
        if: steps.merge.outputs.result == 'merged'
        run: |
          set -o pipefail
          cargo fmt --check
          cargo check -p filmcraft
          cargo clippy -p filmcraft -p filmcraft-engine -- -D warnings
          cargo test -p filmcraft-project --lib
      - name: Save rerere cache
        if: always()
        uses: actions/cache@v4
        with:
          path: .git/rr-cache
          key: rerere-filmcraft-${{ github.run_id }}
          restore-keys: rerere-
      - name: Open a PR (never push to madson)
        if: steps.merge.outputs.result == 'merged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git commit -m "Port ${{ steps.tag.outputs.tag }}: merge upstream into madson (bot)"
          git push origin "port-bot/${{ steps.tag.outputs.tag }}"
          gh pr create --repo "${{ github.repository }}" --base madson \
            --head "port-bot/${{ steps.tag.outputs.tag }}" \
            --title "Port ${{ steps.tag.outputs.tag }} : merge upstream (gates verts)" \
            --body "Merge à blanc + fmt/clippy/check/tests verts. Relire docs/port-*.md avant de merger."
      - name: Report a conflict
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Port ${{ steps.tag.outputs.tag }} : $(wc -l < conflicts.txt) fichiers en conflit" \
            --body-file conflicts.txt || true
      - name: Summary
        run: echo "port-check $APP ${{ steps.tag.outputs.tag }} => ${{ steps.merge.outputs.result || 'n/a' }}"
