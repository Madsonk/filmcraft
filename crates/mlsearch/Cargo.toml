[package]
name = "filmcraft-mlsearch"
description = "FilmCraft semantic search: SigLIP image and text embeddings in pure Rust on candle, vector index (from LightCraft's lightcraft-search, Apache-2.0)"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
siphasher = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { version = "=0.9.2", default-features = false }
candle-nn = { version = "=0.9.2", default-features = false }
filmcraft-mlfetch = { path = "../mlfetch" }
half = "2"
rayon = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "=0.9.2", default-features = false, features = ["metal"] }
candle-nn = { version = "=0.9.2", default-features = false, features = ["metal"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
