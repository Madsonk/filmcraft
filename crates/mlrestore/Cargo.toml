[package]
name = "filmcraft-mlrestore"
description = "FilmCraft AI super-resolution (SPAN) and denoising (SCUNet): tiled inference in pure Rust on candle (from LightCraft's lightcraft-restore, same author)"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
log = { workspace = true }
miniz_oxide = "0.8"
rayon = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { version = "=0.9.2", default-features = false }
candle-nn = { version = "=0.9.2", default-features = false }
filmcraft-mlfetch = { path = "../mlfetch" }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "=0.9.2", default-features = false, features = ["metal"] }
candle-nn = { version = "=0.9.2", default-features = false, features = ["metal"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
