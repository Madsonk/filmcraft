[package]
name = "filmcraft-engine"
description = "FilmCraft engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Speech-to-text with Whisper (candle, CPU). Off by default and in wasm builds.
whisper = ["filmcraft-speech/whisper", "filmcraft-speech/translate"]
# Speech-model downloads over HTTPS.
speech-download = ["filmcraft-speech/download"]
# Downloads of the optional neural models (voice clean-up, auto-reframe) over HTTPS.
model-download = ["filmcraft-modelstore/download"]
# Optional neural tools (RIFE interpolation, Beat This beats, rush search, super-resolution…) on candle.
ml = ["dep:rayon", "dep:filmcraft-ml", "dep:filmcraft-mlsearch", "dep:filmcraft-mlrestore", "dep:filmcraft-mlfetch"]

[dependencies]
filmcraft-time = { workspace = true }
filmcraft-geom = { workspace = true }
filmcraft-color = { workspace = true }
filmcraft-frame = { workspace = true }
filmcraft-media = { workspace = true }
filmcraft-codecs = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-edit = { workspace = true }
filmcraft-render = { workspace = true }
filmcraft-scopes = { workspace = true }
filmcraft-text = { workspace = true }
filmcraft-audio-dsp = { workspace = true }
filmcraft-export = { workspace = true }
filmcraft-mxf = { workspace = true }
filmcraft-format = { workspace = true }
filmcraft-aac = { workspace = true }
filmcraft-isobmff = { workspace = true }
filmcraft-interchange = { workspace = true }
filmcraft-captions = { workspace = true }
filmcraft-speech = { workspace = true }
filmcraft-modelstore = { path = "../modelstore" }
filmcraft-voice = { path = "../voice" }
filmcraft-reframe = { path = "../reframe" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
web-time = "1"
# .mogrt titles made in Premiere → .fcgt (titles-native): the ZIP, the gzipped project XML
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
roxmltree = { workspace = true }
rayon = { workspace = true, optional = true }
filmcraft-ml = { path = "../ml", optional = true }
filmcraft-mlsearch = { path = "../mlsearch", optional = true }
filmcraft-mlrestore = { path = "../mlrestore", optional = true }
filmcraft-mlfetch = { path = "../mlfetch", optional = true }

[dev-dependencies]
filmcraft-testkit = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
