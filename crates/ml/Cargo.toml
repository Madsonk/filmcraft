[package]
name = "filmcraft-ml"
description = "FilmCraft optional neural tools (frame interpolation RIFE, beat tracking, matting, source separation) in pure Rust on candle, plus the L1 stabiliser. Weights are never bundled."
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { version = "=0.9.2", default-features = false }
candle-nn = { version = "=0.9.2", default-features = false }
filmcraft-mlfetch = { path = "../mlfetch" }
filmcraft-mlrestore = { path = "../mlrestore" }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "=0.9.2", default-features = false, features = ["metal"] }
candle-nn = { version = "=0.9.2", default-features = false, features = ["metal"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
